    <section class="main js-main">
      <!--<section>
        <div class=""></div>
      </section>-->

      <section class="section-1">
        <section class="section-part-1">
            <h1>Delivery Information</h1>

          <div class="delivery-information-section">
            <div class="delivery-information-section-1">
              <label>Full name</label>
              <input placeholder="Enter your first name and last name">
            </div>
            <div class="delivery-information-section-2">
              <label>Province</label>
              <input placeholder="Enter your province">
            </div>
          </div>

          <div class="delivery-information-section">
            <div class="delivery-information-section-1">
              <label>Phone Number</label>
              <input placeholder="Enter your phone number">
            </div>
            <div class="delivery-information-section-2">
              <label>City</label>
              <input placeholder="Enter your city">
            </div>
          </div>

          <div class="delivery-information-section">
            <div class="delivery-information-section-1">
              <label>Building / House No / Floor / Street</label>
              <input placeholder="Enter ">
            </div>
            <div class="delivery-information-section-2">
              <label>Area</label>
              <input placeholder="Enter your area">
            </div>
          </div>

          <div class="delivery-information-section">
            <div class="delivery-information-section-1">
              <label>Colony / Suburb / Locality / Landmark</label>
              <input placeholder="Enter ">
            </div>
            <div class="delivery-information-section-2">
              <label>Address</label>
              <input placeholder="For Example: House# 123, Street# 123, ABC Roa">
            </div>
          </div>
        </section>

        <section class="section-part-2">
          <div class="section-part-2-delivery">
            <p class="delivery">Delivery Option</p>
            <div class="section-part-2-delivery-inside">
              <p class="tick">&check;</p>
              <div class="section-part-2-delivery-info">
                <p class="rupee">Rs. 125</p>
                <p class="standard">Standard Delivery</p>
                <p class="guarantee">Guaranteed by 21-27 Sep</p>
              </div>
            </div>
          </div>
          <div class="section-part-2-Item js-section-part-2-Item">

          </div>
        </section>
      </section>

      <section class="section-2">
        <div class="order-summary-container">
          <p class="order-summary-header">Promotion</p>
          <div class="order-summary-voucher">
            <input placeholder="Enter Store/Daraz Code">
            <button>APPLY</button>
          </div>
          <p class="order-summary-header">Order Summary</p>
          <div class="order-summary-sub">
            <p class="order-summary-sub-p1">Items Total (<span class="js-order-summary-sub-p1"></span> items)</p>
            <p class="order-summary-sub-p2">Rs. <span class="js-item-total"></span></p>
          </div>
          <div class="order-summary-shipping">
            <p class="order-summary-shipping-p1">Delivery Fee</p>
            <p>Rs. <span class="js-delivery-fee"></span></p>
          </div>
          <div class="order-summary-total">
            <p>Total</p>
            <p class="order-summary-total-p2">Rs. <span class="js-Total"></span></p>
          </div>
          <button class="order-summary-button">Proceed to Pay</button>
        </div>
      </section>
    </section>
